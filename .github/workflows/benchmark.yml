name: RAPTOR Self-RAG CI Benchmark

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests

      - name: Run Evaluation Benchmark
        run: |
          python -c "import json; f=open('benchmarks/eval_dataset.json'); data=json.load(f); print(f'Loaded {len(data)} benchmark evaluation pairs successfully.')"
