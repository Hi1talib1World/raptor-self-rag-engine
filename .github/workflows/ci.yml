name: RAPTOR Self-RAG CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest -r requirements.txt

      - name: Code Linting (Ruff)
        run: |
          ruff check . --ignore E501,E402,F401,F841 || true

      - name: Type Inspection (Mypy)
        run: |
          mypy src/ --ignore-missing-imports --no-strict-optional || true

      - name: Run Pytest & Unittest Suite
        run: |
          python -m unittest discover -s tests

      - name: Run Benchmark Evaluator
        run: |
          python benchmarks/eval_rag.py

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t raptor-self-rag-engine:ci .

      - name: Test Docker Compose Configuration
        run: |
          docker compose config
